<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人事管理系统主界面</title>
    <link rel="stylesheet" href="/css/login.css"> <!-- 复用现有登录样式 -->
    <link rel="stylesheet" href="/css/main.css"> <!-- 主界面样式 -->
    <!-- 引入 Vue3 和 axios（与登录页保持一致） -->
    <script src="/js/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <!-- 固定顶部容器 -->
        <div class="top-container">
            <!-- 顶部标题 -->
            <div class="header">
                <h1>人事管理系统</h1>
            </div>
            
            <!-- 登录用户名显示 -->
            <div class="username">
                当前登录用户：{{ username }}
            </div>
            
            <!-- 导航栏 -->
            <div class="nav-container">
                <div 
                    class="nav-item"
                    :class="{ active: activeMenu === 'personnal' }"
                    @click="activeMenu = 'personnal'; personnal()"
                >
                    人事管理
                </div>
                <div 
                    class="nav-item"
                    :class="{ active: activeMenu === 'salary' }"
                    @click="activeMenu = 'salary'"
                >
                    工资管理
                </div>
                <div 
                    class="nav-item"
                    :class="{ active: activeMenu === 'attendance' }"
                    @click="activeMenu = 'attendance'"
                >
                    考勤管理
                </div>
                <div 
                    class="nav-item"
                    :class="{ active: activeMenu === 'memo' }"
                    @click="activeMenu = 'memo'"
                >
                    备忘录
                </div>
                <div 
                    class="nav-item"
                    :class="{ active: activeMenu === 'database' }"
                    @click="activeMenu = 'database'"
                >
                    数据库管理
                </div>
                <div 
                    class="nav-item"
                    :class="{ active: activeMenu === 'system' }"
                    @click="activeMenu = 'system'"
                >
                    系统管理
                </div>
            </div>
        </div>

        <!-- 内容显示区域（在顶部容器下方） -->
        <div class="content">
            <!-- 人事管理按钮组（新增） -->
            <div v-if="activeMenu === 'personnal'" class="button-container">
                <button class="action-btn" @click="handleAdd">添加</button>
                <button class="action-btn" @click="handleEdit">修改</button>
                <button class="action-btn" @click="handleDelete">删除</button>
                <button class="action-btn" @click="handleReset">重置</button>
            </div>

            <!-- 人事管理表格（根据activeMenu动态显示） -->
            <table v-if="activeMenu === 'personnal'" class="data-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" v-model="selectAll"></th>
                        <th v-for="col in personnalColumns" :key="col.key">{{ col.title }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tbody>
                        <tr v-for="emp in employees" :key="emp.pid">
                            <td><input type="checkbox" v-model="selectedPids" :value="emp.pid" @change="handleCheckboxChange(emp.pid)"></td>
                            <td v-for="col in personnalColumns" :key="col.key">
                                <!-- 照片列显示图片 -->
                                <img v-if="col.key === 'photo'" 
                                     :src="'/photo/' + emp[col.key] + '.jpg'" 
                                     alt="员工照片" 
                                     style="max-width: 100px; max-height: 100px;">
                                
                                <!-- 非照片列：编辑状态时显示文本框，否则显示可双击的文本 -->
                                <input v-else-if="isEditable(emp.pid, col.key)" 
                                       type="text" 
                                       v-model="emp[col.key]" 
                                       @blur="finishEdit(emp.pid, col.key)">
                                
                                <span v-else 
                                      @dblclick="makeEditable($event, emp.pid, col.key)" 
                                      style="cursor: pointer;">
                                    {{ emp[col.key] }}
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </tbody>
            </table>
            
        </div>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
